name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Test
        run: npx nx run-many -t test --skip-sync --outputStyle=static -- --passWithNoTests

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx nx run artcraft:build --skip-sync --outputStyle=static

  installers:
    name: Installers (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: bash -n install.sh

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  rust:
    name: Rust (check + test)
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libxdo-dev libxkbcommon-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Tauri checks that the frontend output folder exists at compile time.
      - run: mkdir -p frontend/apps/artcraft/dist

      - run: cargo check --workspace --all-targets

      - run: cargo test --workspace --lib
